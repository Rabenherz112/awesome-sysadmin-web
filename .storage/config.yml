# ASWG Configuration

# =============================================================================
# SITE METADATA
# =============================================================================
site:
  title: "Awesome Sysadmin"
  description: "Discover and explore sysadmin applications"
  url: "https://awesome-sysadmin.theravenhub.com"
  author: "awesome sysadmin community"
  base_path: "" # Leave empty for root, or set to "/awesome-selfhosted" for subdirectory

# =============================================================================
# DATA SOURCES
# =============================================================================
data:
  data_dir: "awesome-sysadmin-data"
  software_dir: "software"
  categories_dir: "tags"
  platforms_dir: "platforms"
  licenses_file: "licenses.yml"
  #licenses_nonfree_file: "licenses-nonfree.yml"

# =============================================================================
# BUILD SETTINGS
# =============================================================================
build:
  output_dir: "output"
  template_dir: "templates"
  static_dir: "static"
  data_cache_dir: "data"

generation:
  items_per_page: 24
  enable_search_index: true
  minify_html: false
  generate_sitemap: true
  enable_pagination: true
  let_user_choose_pagination_size: true
  use_git_data: true

# =============================================================================
# UI CONFIGURATION
# =============================================================================
ui:
  # Page title formatting
  title_format: "{page_title} - {site_title}"
  title_separator: " - "

  # Banner configuration
  banner:
    enabled: false
    dismissible: true
    style: "info"  # info, warning, success, announcement
    text: "**New Release!** Check out our latest features and improvements" # Markdown bold (**text**) is supported
    button:
      text: "Release Notes"
      url: "https://github.com/awesome-selfhosted/awesome-selfhosted/releases" # this can also be "/browse.html" if external is set to false
      external: true

  show_project_icons: false

  # Content limits for different sections
  limits:
    homepage_popular_apps: 8
    homepage_recently_updated: 8
    homepage_random_picks: 6
    homepage_category_stats: 8
    homepage_alternatives: 6
    related_apps: 6
    browse_max_categories_per_card: 2
    browse_max_platforms_per_card: 3
    alternatives_max_categories_per_card: 2
    alternatives_max_platforms_per_card: 3

  # Text truncation settings
  truncation:
    default_description_length: 150
    homepage_description_length: 70
    browse_description_length: 90
    browse_description_full: false
    alternatives_description_length: 90
    alternatives_description_full: false
    related_apps_description_length: 100

  # Homepage configuration
  homepage:
    include_nonfree: false
    sections:
      - hero
      - popular_apps
      - recently_updated
      - random_picks
      - alternatives
      - popular_categories
      - statistics
      - footer_markdown

  # Footer markdown exclusions
  footer_markdown:
    exclude_sections:
      - "Anti-features"
      - "Contributing"
      # - "External Links"
      # - "License"

# =============================================================================
# HERO SECTION
# =============================================================================
hero:
  title: "Awesome Sysadmin"
  subtitle: "Discover amazing sysadmin Applications"
  description: 'A curated list of amazingly awesome Free and Open-Source sysadmin resources. This is a list of <a href="https://en.wikipedia.org/wiki/Free_software">Free Software</a> for <a href="https://en.wikipedia.org/wiki/System_administrator">System administrator</a> tasks. Consider <a href="https://github.com/n1trux/awesome-donations">donating</a> to the FLOSS projects you use regularly.'
  
  # Badges to display
  badges:
    - name: "Awesome"
      image: "/static/images/awesome.png"
      url: "https://github.com/sindresorhus/awesome"
    - name: "Build Status"
      image: "https://github.com/Rabenherz112/awesome-sysadmin-web/actions/workflows/build.yml/badge.svg"
      url: "https://github.com/Rabenherz112/awesome-sysadmin-web/actions/workflows/build.yml"
    - name: "Metadata Updated"
      image: "https://github.com/awesome-foss/awesome-sysadmin-data/actions/workflows/update-metadata.yml/badge.svg"
      url: "https://github.com/awesome-foss/awesome-sysadmin-data/issues/1"
  
  # Additional links
  links:
    - name: "GitHub Repository"
      url: "https://github.com/awesome-foss/awesome-sysadmin"
      description: "Markdown version (legacy)"
    - name: "Main Website"
      url: "https://sysadmin.awesome-selfhosted.net/"
      description: "Main Frontend for this dataset"
    - name: "Contributing Guide"
      url: "https://github.com/awesome-foss/awesome-sysadmin/blob/master/CONTRIBUTING.md"
      description: "How to contribute to this project"
  
  # Call to action buttons
  cta_buttons:
    - name: "Browse All Applications"
      url: "/browse.html"
      style: "primary"
      icon: "grid"

# =============================================================================
# NAVIGATION & FOOTER
# =============================================================================
navigation:
  - title: "Browse"
    url: "/browse.html"
  - title: "Alternatives"
    url: "/alternatives.html"
    enabled: "{{ alternatives.enabled }}"  # Conditional navigation
  - title: "Statistics" 
    url: "/statistics.html"

footer:
  logo_text: "{{ site.title }}"
  tagline: "{{ site.description }}"
  credit_text: "Built with ❤️ for the self-hosting community"
  footer_text: |
    Copyright © 2015-{{ current_year }}, the {{ site.author }}. Data from 
    <a href="https://github.com/awesome-foss/awesome-sysadmin-data" class="text-link hover:text-link-hover">awesome-sysadmin-data</a>
    <br>
    <a href="https://github.com/awesome-foss/awesome-sysadmin-data/blob/master/LICENSE" class="text-link hover:text-link-hover">Content under CC-BY-SA 4.0 license</a>

  # Footer sections
  sections:
    navigation:
      title: "Navigation"
      links:
        - title: "Home"
          url: "/"
        - title: "Browse"
          url: "/browse.html"
        - title: "Alternatives"
          url: "/alternatives.html"
          enabled: "{{ alternatives.enabled }}"  # Conditional navigation
        - title: "Statistics"
          url: "/statistics.html"

    resources:
      title: "Resources"
      links:
        - title: "Website Source"
          url: "https://github.com/Rabenherz112/awesome-sysadmin-web"
          external: true
        - title: "Data Source"
          url: "https://github.com/awesome-foss/awesome-sysadmin-data"
          external: true
        - title: "Sitemap"
          url: "/sitemap.xml"

# =============================================================================
# PAGE METADATA
# =============================================================================
pages:
  browse:
    title: "Browse Applications"
    description: "Discover {total_applications} sysadmin applications"

  statistics:
    title: "Statistics"
    description: "Explore trends and insights from the sysadmin community"

  alternatives:
    title: "Alternative Software"
    description: "Find alternatives to popular sysadmin software"

  home:
    meta_title: "Discover Sysadmin Applications"
    meta_description: "Find the perfect applications for your sysadmin needs"

# =============================================================================
# ALTERNATIVES PAGE CONFIGURATION
# =============================================================================
alternatives:
  enabled: false  # Set to false to disable the alternatives page
  min_alternatives: 2  # Minimum number of alternatives required to show a software
  show_more_threshold: 3 # Show "Show More" button if there are more than this number of alternatives
  show_statistics: true  # Show statistics section on the page

# =============================================================================
# SEARCH CONFIGURATION
# =============================================================================
search:
  fuzzy_threshold: 0.3
  max_results: 8
  min_query_length: 3
  search_fields:
    - name
    - description
    - categories
  placeholder_text: "Search applications..."

# =============================================================================
# RELATED APPS ALGORITHM
# =============================================================================
related_apps:
  scoring:
    semantic_similarity:
      enabled: true
      max_score: 25
    categories:
      enabled: true
      points_per_match: 4
    alternatives:
      enabled: true
      points_per_match: 6
    forks:
      enabled: true
      same_parent_score: 8
    platforms:
      enabled: true
      points_per_match: 2
    license:
      enabled: true
      same_type_score: 2
    popularity:
      enabled: true
      same_tier_score: 1
    dependencies:
      enabled: true
      same_status_score: 1
  tiebreakers:
    - stars
    - name
  min_score: 3
  debug: false

# =============================================================================
# LINK BEHAVIOR
# =============================================================================
links:
  open_in_new_tab_for_internal_links: false
  open_in_new_tab_for_external_links: false

# =============================================================================
# SEO & ROBOTS
# =============================================================================
robots:
  generate: true
  user_agent: "*"
  allow:
    - "/"
  disallow:
    - "/static/"
  sitemap_url: "/sitemap.xml"

# =============================================================================
# HTACCESS CONFIGURATION
# =============================================================================
# Important: .htaccess files are only supported by Apache Servers, if you are using a different web server, this will be ignored.
htaccess:
  generate: true  # Set to true to generate .htaccess file
  remove_html_extension: true  # Remove .html extension from URLs
